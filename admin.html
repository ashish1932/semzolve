<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Inquiries & RFQ Lead Portal | Semzolve Technologies</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <style>
    :root {
      --bg: #030A24;
      --card-bg: #061649;
      --accent: #05B8FB;
      --text: #F8FAFC;
      --muted: #94A3B8;
      --border: rgba(5, 184, 251, 0.2);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Schibsted Grotesk', system-ui, sans-serif;
      padding: 30px 5vw;
      min-height: 100vh;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 30px;
    }
    .brand-wrap { display: flex; align-items: center; gap: 14px; }
    .brand-wrap img { height: 36px; }
    .portal-tag {
      background: rgba(5, 184, 251, 0.15);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: 1px solid var(--border);
    }
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
    }
    .stat-num { font-size: 28px; font-weight: 800; color: var(--accent); margin-bottom: 4px; }
    .stat-label { font-size: 13px; color: var(--muted); }

    .actions-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 20px;
    }
    .search-input {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 16px;
      color: #fff;
      font-size: 14px;
      width: 320px;
      max-width: 100%;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-primary { background: var(--accent); color: #030A24; border: none; }
    .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .btn-outline:hover { background: rgba(255,255,255,0.05); }

    .table-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13.5px;
    }
    th {
      background: rgba(3, 10, 36, 0.6);
      padding: 14px 18px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 14px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      vertical-align: top;
    }
    tr:hover td { background: rgba(5, 184, 251, 0.03); }
    .ref-badge {
      font-family: 'JetBrains Mono', monospace;
      color: var(--accent);
      font-weight: 600;
      font-size: 12px;
    }
    .time-txt { font-size: 12px; color: var(--muted); }
    .product-clip {
      max-width: 260px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12.5px;
      color: #CBD5E1;
    }
    .status-pill {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      background: rgba(16, 185, 129, 0.15);
      color: #10B981;
    }
    .empty-state {
      padding: 60px 20px;
      text-align: center;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-wrap">
      <img src="images/semzolve-logo.png" alt="SEMZOLVE">
      <span class="portal-tag">RFQ &amp; Customer Inquiries Database</span>
    </div>
    <div style="display:flex; gap:12px;">
      <a href="/index.html" class="btn btn-outline">← Back to Site</a>
      <a href="/api/export-csv" class="btn btn-primary">⬇ Export CSV</a>
    </div>
  </header>

  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-num" id="totalCount">0</div>
      <div class="stat-label">Total Inquiries Captured</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="countriesCount">0</div>
      <div class="stat-label">Unique Buyer Countries</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="dbStatus">Active</div>
      <div class="stat-label">SQLite Engine Status</div>
    </div>
  </div>

  <div class="actions-bar">
    <input type="text" id="searchInput" class="search-input" placeholder="Filter by product, company, country, or email..." onkeyup="filterTable()">
    <button type="button" onclick="loadInquiries()" class="btn btn-outline">↻ Refresh</button>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Ref ID</th>
          <th>Date &amp; Time</th>
          <th>Contact &amp; Company</th>
          <th>Email &amp; Phone</th>
          <th>Country &amp; Incoterm</th>
          <th>Chemicals / Requirement</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="inquiriesTableBody">
        <tr>
          <td colspan="7" class="empty-state">Loading inquiries from database...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    let allInquiries = [];

    async function loadInquiries() {
      try {
        const resp = await fetch('/api/inquiries');
        if (!resp.ok) throw new Error('Failed to fetch from API');
        const data = await resp.json();
        allInquiries = data.inquiries || [];

        document.getElementById('totalCount').textContent = allInquiries.length;
        
        const countries = new Set(allInquiries.map(i => i.country).filter(Boolean));
        document.getElementById('countriesCount').textContent = countries.size;

        renderTable(allInquiries);
      } catch (e) {
        document.getElementById('inquiriesTableBody').innerHTML = `
          <tr>
            <td colspan="7" class="empty-state" style="color:#EF4444;">
              Failed to connect to /api/inquiries backend. Make sure server.py is running.
            </td>
          </tr>
        `;
      }
    }

    function renderTable(list) {
      const tbody = document.getElementById('inquiriesTableBody');
      if (!list.length) {
        tbody.innerHTML = `<tr><td colspan="7" class="empty-state">No inquiries recorded yet. Submit a test quote from the contact page.</td></tr>`;
        return;
      }

      tbody.innerHTML = list.map(item => `
        <tr>
          <td><span class="ref-badge">${escapeHtml(item.ref_id)}</span></td>
          <td><span class="time-txt">${escapeHtml(item.created_at)}</span></td>
          <td>
            <strong>${escapeHtml(item.name)}</strong><br>
            <span style="font-size:12px; color:var(--muted);">${escapeHtml(item.company || 'Individual')}</span>
          </td>
          <td>
            <a href="mailto:${escapeHtml(item.email)}" style="color:var(--accent); text-decoration:none;">${escapeHtml(item.email)}</a><br>
            <span style="font-size:12px; color:var(--muted);">${escapeHtml(item.phone || '-')}</span>
          </td>
          <td>
            <strong>${escapeHtml(item.country)}</strong><br>
            <span style="font-size:12px; color:var(--muted);">${escapeHtml(item.incoterm || 'CIF')}</span>
          </td>
          <td>
            <div class="product-clip" title="${escapeHtml(item.products)}">${escapeHtml(item.products)}</div>
            <span style="font-size:11px; color:#64748B;">${escapeHtml(item.need || 'Quotation')}</span>
          </td>
          <td><span class="status-pill">${escapeHtml(item.status || 'New')}</span></td>
        </tr>
      `).join('');
    }

    function filterTable() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allInquiries.filter(i => 
        (i.name && i.name.toLowerCase().includes(q)) ||
        (i.company && i.company.toLowerCase().includes(q)) ||
        (i.email && i.email.toLowerCase().includes(q)) ||
        (i.country && i.country.toLowerCase().includes(q)) ||
        (i.products && i.products.toLowerCase().includes(q)) ||
        (i.ref_id && i.ref_id.toLowerCase().includes(q))
      );
      renderTable(filtered);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // Auto-load on page ready
    loadInquiries();
  </script>
</body>
</html>
